<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>图片展示 - 响应式多端适配版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b1013;
            color: #e0e6ed;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 模拟手机容器：采用静态渐变背景，色调平滑过渡，同时完美适配移动端与桌面端高度 */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            transition: background 0.8s ease;
        }

        /* 1. 顶部 Header (利用安全距离与额外边距向下移动，完美避开手机灵动岛/刘海屏，兼顾桌面端) */
        .header {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: calc(env(safe-area-inset-top, 20px) + 24px);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 17px;
            letter-spacing: 6px;
            color: #d1d8e0;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .header-title::before, .header-title::after {
            content: "";
            display: inline-block;
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #52636d, transparent);
        }

        /* 2. 字母导航 A - F (适当增加顶部间距，与顶部标题保持舒适的层次感) */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            padding: 14px 24px 10px;
            flex-shrink: 0;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 15px;
            color: #6c7c88;
            transition: all 0.3s ease;
            width: 38px;
        }

        .tab-item.active {
            color: #ffffff;
            font-weight: 500;
        }

        .tab-item .circle-bg {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: all 0.3s ease;
            font-family: Georgia, serif;
        }

        .tab-item.active .circle-bg {
            background: rgba(78, 142, 137, 0.25);
            border: 1px solid rgba(116, 185, 178, 0.45);
            box-shadow: 0 0 12px rgba(116, 185, 178, 0.2);
        }

        .tab-indicator {
            width: 14px;
            height: 2px;
            background-color: #74b9b2;
            margin-top: 6px;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab-item.active .tab-indicator {
            opacity: 1;
        }

        /* 3. 主图轮播区域 */
        .carousel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 12px 0 0 0;
        }

        .carousel-container {
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .swiper-wrapper {
            display: flex;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: grab;
            align-items: center;
        }

        .swiper-wrapper:active {
            cursor: grabbing;
        }

        .swiper-slide {
            flex: 0 0 88%;
            margin: 0 6%;
            aspect-ratio: 2 / 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s ease, opacity 0.35s ease, box-shadow 0.35s ease;
            opacity: 0.4;
            transform: scale(0.92);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .swiper-slide.active {
            opacity: 1;
            transform: scale(1);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slide-hint {
            position: absolute;
            right: 12px;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 分页圆点 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #26333c;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #74b9b2;
            width: 16px;
            border-radius: 4px;
        }

        /* 4. 图片信息与美化底栏 (增加底部安全距离适配全面屏手势条) */
        .info-panel {
            flex: 1.2;
            padding: 24px 30px calc(24px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
        }

        .info-content {
            display: flex;
            flex-direction: column;
        }

        .info-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }

        .info-panel .letter {
            font-size: 32px;
            color: #74b9b2;
            font-weight: 300;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .info-panel .title {
            font-size: 20px;
            color: #f0f4f8;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .info-panel .divider {
            width: 24px;
            height: 1px;
            background: #74b9b2;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .info-panel .desc {
            font-size: 13px;
            color: #8c9fae;
            line-height: 1.85;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* 底部精致入口卡片 */
        .bottom-action-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
            backdrop-filter: blur(10px);
        }

        .bottom-action-card:active {
            background: rgba(116, 185, 178, 0.1);
            border-color: rgba(116, 185, 178, 0.3);
            transform: scale(0.99);
        }

        .action-text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .action-main-text {
            font-size: 13px;
            color: #d1d8e0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-sub-text {
            font-size: 11px;
            color: #637582;
            letter-spacing: 0.5px;
        }

        .action-arrow {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(116, 185, 178, 0.12);
            color: #74b9b2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .bottom-action-card:hover .action-arrow {
            transform: translateX(3px);
        }

        /* 5. 底部高弹窗列表 (支持内部上下滚动) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 90%;
            background: #11171b;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-overlay.open .drawer {
            transform: translateY(0);
        }

        .drawer-header {
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .drawer-title {
            font-size: 15px;
            color: #d1d8e0;
            letter-spacing: 1.5px;
            font-weight: 300;
        }

        .drawer-close {
            font-size: 22px;
            color: #7a8b97;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }

        /* 弹窗内容容器：支持上下滚动 */
        .drawer-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .drawer-content::-webkit-scrollbar {
            width: 4px;
        }
        .drawer-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .ratio-2-1-item {
            width: 100%;
            aspect-ratio: 2 / 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a242a;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .ratio-2-1-item:active {
            transform: scale(0.98);
        }

        .ratio-2-1-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 6. 大图预览 Lightbox */
        .lightbox-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .lightbox-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-overlay.is-loading::after {
            content: "高清图片加载中…";
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            padding: 7px 12px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.58);
            color: rgba(255, 255, 255, 0.82);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .lightbox-img {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox-overlay.open .lightbox-img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
        }
    

        /* Responsive bridge: wrappers do not affect the original portrait layout. */
        .desktop-left-pane,
        .desktop-right-pane,
        .lightbox-container {
            display: contents;
        }
        @media (min-width: 900px) and (min-height: 600px) {
            body {
                background: #06090c;
            }
            .app-container {
                max-width: 1520px;
                max-height: 880px;
                height: 92vh;
                width: 95vw;
                border-radius: 20px;
                flex-direction: row;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            }
            
            /* 左侧面板：大屏下的主图与轮播展示区 */
            .desktop-left-pane {
                display: flex;
                display: flex;
                flex: 1.3;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 30px 24px 24px 30px;
                border-right: 1px solid rgba(255, 255, 255, 0.06);
                height: 100%;
                position: relative;
            }

            /* 右侧面板：大屏下的信息说明与画册列表/抽屉内嵌区 */
            .desktop-right-pane {
                display: flex;
                display: flex;
                flex: 1;
                display: flex;
                flex-direction: column;
                padding: 30px;
                height: 100%;
                background: rgba(0, 0, 0, 0.2);
            }

            .header {
                margin-top: 0 !important;
                justify-content: flex-start !important;
                margin-bottom: 10px;
            }

            .header-title {
                font-size: 19px !important;
            }

            .nav-tabs {
                padding: 8px 0 16px !important;
                justify-content: flex-start !important;
                gap: 12px;
            }

            .tab-item {
                width: 42px !important;
            }

            .tab-item .circle-bg {
                width: 42px !important;
                height: 42px !important;
                font-size: 16px !important;
            }

            .carousel-section {
                margin: auto 0 !important;
            }

            .swiper-slide {
                flex: 0 0 92% !important;
                margin: 0 4% !important;
            }

            /* 横屏时隐藏大图右下角的点击切换提示 */
            .slide-hint {
                display: none !important;
            }

            .info-panel {
                background: transparent !important;
                padding: 0 !important;
                flex: none !important;
                margin-top: 20px;
            }

            /* 横屏时不显示图二内容（底部操作卡片） */
            .bottom-action-card {
                display: none !important;
            }

            /* 隐藏手机端单独的弹窗遮罩结构，在大屏下直接将画册融入右侧面板展示 */
            .modal-overlay {
                position: static !important;
                background: transparent !important;
                backdrop-filter: none !important;
                opacity: 1 !important;
                visibility: visible !important;
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                margin-top: 0;
            }

            .drawer {
                position: static !important;
                transform: none !important;
                height: 100% !important;
                background: transparent !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
                display: flex;
                flex-direction: column;
            }

            .drawer-header {
                padding: 0 0 14px 0 !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            }

            .drawer-close {
                display: none !important;
            }

            .drawer-content {
                padding: 16px 0 0 0 !important;
                gap: 14px !important;
            }
        }

        @media (min-width: 900px) and (min-height: 600px) {
            .lightbox-container {
                display: flex;
                max-width: 95%;
                max-height: 85%;
                align-items: center;
                justify-content: center;
                transition: transform 0.1s ease-out;
                transform-origin: center center;
            }

            .lightbox-container .lightbox-img {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- 适配PC端横屏的左侧面板 -->
        <div class="desktop-left-pane">
            <!-- 顶部标题栏 -->
            <div class="header">
                <div class="header-title">图片展示</div>
            </div>

            <!-- A-F 导航标签 -->
            <div class="nav-tabs" id="navTabs"></div>

            <!-- 轮播主图区域 (2:1 比例) -->
            <div class="carousel-section">
                <div class="carousel-container">
                    <div class="swiper-wrapper" id="swiperWrapper"></div>
                </div>
                <!-- 分页圆点 -->
                <div class="pagination" id="pagination"></div>
            </div>

            <!-- 图片文字描述与底部精致面板 (移动端默认展示，PC大屏下保留描述) -->
            <div class="info-panel" id="infoPanelContainer">
                <div class="info-content">
                    <div class="info-header">
                        <div class="letter" id="infoLetter">A</div>
                        <div class="title" id="infoTitle">山水行舟图</div>
                    </div>
                    <div class="divider"></div>
                    <div class="desc" id="infoDesc">青山隐隐水迢迢，舟行碧波上，远岸炊烟起，心随景远，意境悠长。</div>
                </div>

                <!-- 底部操作卡片 (横版时已自动隐藏) -->
                <div class="bottom-action-card" id="actionCardBtn" onclick="handleActionCardClick()">
                    <div class="action-text-group">
                        <div class="action-main-text">
                            <span id="actionMainTextSpan">点击图集或此处查看合集</span>
                        </div>
                    </div>
                    <div class="action-arrow">➔</div>
                </div>
            </div>
        </div>

        <!-- 适配PC端横屏的右侧面板 (在PC大屏下直接作为画册展区，手机端则作为上拉抽屉) -->
        <div class="desktop-right-pane">
            <!-- 底部高弹窗列表 / PC大屏内嵌画册列表 -->
            <div class="modal-overlay" id="modalOverlay">
                <div class="drawer" onclick="event.stopPropagation()">
                    <div class="drawer-header">
                        <span class="drawer-title" id="drawerTitle">画册列表</span>
                        <span class="drawer-close" id="closeDrawer">&times;</span>
                    </div>
                    <div class="drawer-content" id="drawerContent"></div>
                </div>
            </div>
        </div>

        <!-- 全屏大图放大预览 (Lightbox) -->
        <div class="lightbox-overlay" id="lightboxOverlay">
            <span class="lightbox-close" id="closeLightbox">&times;</span>
            <div class="lightbox-container" id="lightboxContainer">
                <img src="" alt="放大图" class="lightbox-img" id="lightboxImg">
            </div>
        </div>
    </div>

    <!-- 隐藏的 Canvas 用于提取图片主要色调 -->
    <canvas id="colorCanvas" style="display:none;"></canvas>

    <script>
        // A-F 标题、正文与图片配置从同目录 JSON 文件异步加载。
        let itemsData = [];

        let currentIndex = 0;
        let currentScale = 1; // 记录当前缩放倍数
        let lightboxRequestId = 0;

        // DOM 元素
        const appContainer = document.getElementById('appContainer');
        const navTabs = document.getElementById('navTabs');
        const swiperWrapper = document.getElementById('swiperWrapper');
        const pagination = document.getElementById('pagination');
        const infoLetter = document.getElementById('infoLetter');
        const infoTitle = document.getElementById('infoTitle');
        const infoDesc = document.getElementById('infoDesc');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeDrawer = document.getElementById('closeDrawer');
        const drawerContent = document.getElementById('drawerContent');
        const drawerTitle = document.getElementById('drawerTitle');

        const lightboxOverlay = document.getElementById('lightboxOverlay');
        const lightboxContainer = document.getElementById('lightboxContainer');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeLightbox = document.getElementById('closeLightbox');
        const colorCanvas = document.getElementById('colorCanvas');
        const ctx = colorCanvas.getContext('2d');

        // 检测当前是否为PC大屏横屏模式
        function isDesktopMode() {
            return window.innerWidth >= 900 && window.innerHeight >= 600;
        }

        // 初始化
        async function init() {
            try {
                const response = await fetch('./gallery-data.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data) || !data.length) throw new Error('JSON 数据为空');
                itemsData = data;
            } catch (error) {
                console.error('gallery-data.json 加载失败：', error);
                infoTitle.textContent = '数据加载失败';
                infoDesc.textContent = '请通过本地服务器或网站访问此页面，并确认 gallery-data.json 与 HTML 位于同一目录。';
                return;
            }

            renderNav();
            renderSwiper();
            renderPagination();
            updateState(0);
            bindSwipeEvents();
            bindLightboxZoomEvents(); // 绑定大图缩放事件

            // 如果一开始就是大屏模式，默认直接在右侧渲染当前画册
            if (isDesktopMode()) {
                renderDrawerContent(0);
            }

            // 监听窗口大小变化，动态调整布局行为
            window.addEventListener('resize', () => {
                updateState(currentIndex);
                if (isDesktopMode()) {
                    modalOverlay.classList.add('open');
                    renderDrawerContent(currentIndex);
                } else {
                    modalOverlay.classList.remove('open');
                }
            });
        }

        // 渲染 A-F 导航
        function renderNav() {
            navTabs.innerHTML = itemsData.map((item, index) => `
                <div class="tab-item ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})">
                    <div class="circle-bg">${item.id}</div>
                    <div class="tab-indicator"></div>
                </div>
            `).join('');
        }

        // 渲染主图轮播
        function renderSwiper() {
            swiperWrapper.innerHTML = itemsData.map((item, index) => `
                <div class="swiper-slide ${index === 0 ? 'active' : ''}" onclick="handleSlideClick(${index})">
                    <img src="${item.mainThumb || buildImageUrl(item.img, 960, 68)}" alt="${item.title}" crossorigin="anonymous"
                         decoding="async" fetchpriority="${index === 0 ? 'high' : 'low'}" draggable="false" />
                </div>
            `).join('');
        }

        // 渲染指示圆点
        function renderPagination() {
            pagination.innerHTML = itemsData.map((_, index) => `
                <div class="dot ${index === 0 ? 'active' : ''}"></div>
            `).join('');
        }

        function goToSlide(index) {
            if (index < 0 || index >= itemsData.length) return;
            currentIndex = index;
            updateState(currentIndex);
            if (isDesktopMode()) {
                renderDrawerContent(currentIndex);
            }
        }

        function updateState(index) {
            const slideWidth = swiperWrapper.parentElement.offsetWidth;
            const offset = -index * slideWidth;
            swiperWrapper.style.transform = `translateX(${offset}px)`;

            const slides = document.querySelectorAll('.swiper-slide');
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });

            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            const data = itemsData[index];
            infoLetter.textContent = data.id;
            infoTitle.textContent = data.title;
            infoDesc.textContent = data.desc;

            extractColorsAndApplyBackground(data.img);
        }

        /* 提取图片主要色调并生成静态多色渐变背景 */
        function extractColorsAndApplyBackground(imgSrc) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.src = imgSrc;
            img.onload = () => {
                colorCanvas.width = 40;
                colorCanvas.height = 40;
                ctx.drawImage(img, 0, 0, 40, 40);

                try {
                    const imageData = ctx.getImageData(0, 0, 40, 40).data;
                    let r1 = 0, g1 = 0, b1 = 0;
                    let r2 = 0, g2 = 0, b2 = 0;
                    let r3 = 0, g3 = 0, b3 = 0;
                    let len = imageData.length;
                    let part = Math.floor(len / 3);

                    for (let i = 0; i < len; i += 16) {
                        const r = imageData[i];
                        const g = imageData[i+1];
                        const b = imageData[i+2];
                        if (i < part) {
                            r1 += r; g1 += g; b1 += b;
                        } else if (i < part * 2) {
                            r2 += r; g2 += g; b2 += b;
                        } else {
                            r3 += r; g3 += g; b3 += b;
                        }
                    }

                    const count = part / 16;
                    r1 = Math.floor((r1 / count) * 0.35); g1 = Math.floor((g1 / count) * 0.35); b1 = Math.floor((b1 / count) * 0.35);
                    r2 = Math.floor((r2 / count) * 0.25); g2 = Math.floor((g2 / count) * 0.25); b2 = Math.floor((b2 / count) * 0.25);
                    r3 = Math.floor((r3 / count) * 0.15); g3 = Math.floor((g3 / count) * 0.15); b3 = Math.floor((b3 / count) * 0.15);

                    const color1 = `rgb(${r1}, ${g1}, ${b1})`;
                    const color2 = `rgb(${r2}, ${g2}, ${b2})`;
                    const color3 = `rgb(${r3}, ${g3}, ${b3})`;

                    appContainer.style.background = isDesktopMode()
                        ? `linear-gradient(135deg, ${color1} 0%, ${color2} 60%, ${color3} 100%)`
                        : `radial-gradient(circle at 50% 25%, ${color1} 0%, ${color2} 55%, ${color3} 100%)`;
                } catch (e) {
                    appContainer.style.background = `radial-gradient(circle at 50% 20%, #17232a 0%, #0a0f12 100%)`;
                }
            };
            img.onerror = () => {
                appContainer.style.background = `radial-gradient(circle at 50% 20%, #17232a 0%, #0a0f12 100%)`;
            };
        }

        /* 手势拖拽/滑动支持 */
        function bindSwipeEvents() {
            let startX = 0;
            let isDragging = false;

            const start = (e) => {
                isDragging = true;
                startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                swiperWrapper.style.transition = 'none';
            };

            const move = (e) => {
                if (!isDragging) return;
                const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const diffX = currentX - startX;
                const slideWidth = swiperWrapper.parentElement.offsetWidth;
                const baseTranslate = -currentIndex * slideWidth;
                swiperWrapper.style.transform = `translateX(${baseTranslate + diffX}px)`;
            };

            const end = (e) => {
                if (!isDragging) return;
                isDragging = false;
                const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                const diffX = endX - startX;
                swiperWrapper.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';

                if (diffX < -50 && currentIndex < itemsData.length - 1) {
                    currentIndex++;
                } else if (diffX > 50 && currentIndex > 0) {
                    currentIndex--;
                }
                updateState(currentIndex);
                if (isDesktopMode()) {
                    renderDrawerContent(currentIndex);
                }
            };

            swiperWrapper.addEventListener('touchstart', start, { passive: true });
            swiperWrapper.addEventListener('touchmove', move, { passive: true });
            swiperWrapper.addEventListener('touchend', end);

            swiperWrapper.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
        }

        function handleSlideClick(index) {
            goToSlide(index);
            if (!isDesktopMode()) {
                openDrawer(index);
            }
        }

        function handleActionCardClick() {
            if (!isDesktopMode()) {
                openDrawer(currentIndex);
            }
        }

        /* 弹窗抽屉与大屏右侧列表逻辑 */
        function openDrawer(index) {
            if (isDesktopMode()) return; // PC端无需弹窗抽屉，右侧已固定展示
            renderDrawerContent(index);
            modalOverlay.classList.add('open');
        }

        function renderDrawerContent(index) {
            const data = itemsData[index];
            drawerTitle.textContent = `${data.id} · ${data.title} 画册合集`;

            drawerContent.innerHTML = data.gallery.map((imgUrl, galleryIndex) => `
                <div class="ratio-2-1-item" onclick="openLightbox(${index}, ${galleryIndex})">
                    <img src="${data.thumbnails?.[galleryIndex] || buildImageUrl(imgUrl, 480, 35)}" alt="${data.title} ${galleryIndex + 1}"
                         loading="lazy" decoding="async" fetchpriority="low" />
                </div>
            `).join('');
        }

        // 对支持 URL 参数的图片 CDN 请求实际显示尺寸，避免下载远超屏幕需要的大图。
        function buildImageUrl(source, width, quality) {
            try {
                const url = new URL(source, window.location.href);
                if (url.hostname === 'images.unsplash.com') {
                    url.searchParams.set('auto', 'format');
                    url.searchParams.set('fit', 'crop');
                    url.searchParams.set('w', String(width));
                    url.searchParams.set('h', String(Math.round(width / 2)));
                    url.searchParams.set('q', String(quality));
                }
                return url.href;
            } catch (error) {
                return source;
            }
        }

        function closeDrawerFunc() {
            if (!isDesktopMode()) {
                modalOverlay.classList.remove('open');
            }
        }

        modalOverlay.addEventListener('click', closeDrawerFunc);
        if (closeDrawer) {
            closeDrawer.addEventListener('click', closeDrawerFunc);
        }

        /* 放大预览 Lightbox 逻辑及鼠标滚动整体容器缩放 */
        async function openLightbox(itemIndex, galleryIndex) {
            const source = itemsData[itemIndex].gallery[galleryIndex];
            const requestId = ++lightboxRequestId;
            const previewUrl = itemsData[itemIndex].thumbnails?.[galleryIndex] || buildImageUrl(source, 640, 42);
            const targetWidth = Math.min(2400, Math.max(1200, Math.ceil(window.innerWidth * window.devicePixelRatio)));
            const fullUrl = buildImageUrl(source, targetWidth, 82);

            // 先用已缓存或很小的预览图立即开窗，再无闪烁替换为屏幕适配高清图。
            lightboxImg.src = previewUrl;
            lightboxImg.alt = `${itemsData[itemIndex].title} ${galleryIndex + 1}`;
            lightboxOverlay.classList.add('open');
            lightboxOverlay.classList.add('is-loading');
            currentScale = 1; // 重置缩放比例
            updateLightboxTransform();

            const fullImage = new Image();
            fullImage.decoding = 'async';
            fullImage.src = fullUrl;
            try {
                await fullImage.decode();
                if (requestId !== lightboxRequestId || !lightboxOverlay.classList.contains('open')) return;
                lightboxImg.src = fullUrl;
            } catch (error) {
                console.warn('高清图片加载失败，继续使用预览图：', error);
            } finally {
                if (requestId === lightboxRequestId) lightboxOverlay.classList.remove('is-loading');
            }
        }

        function closeLightboxFunc() {
            lightboxRequestId++;
            lightboxOverlay.classList.remove('open');
            lightboxOverlay.classList.remove('is-loading');
        }

        function updateLightboxTransform() {
            lightboxContainer.style.transform = `scale(${currentScale})`;
        }

        function bindLightboxZoomEvents() {
            // 鼠标滚轮缩放整个图片容器
            lightboxOverlay.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    currentScale = Math.min(currentScale + 0.15, 4); // 最大放大到4倍
                } else {
                    currentScale = Math.max(currentScale - 0.15, 0.5); // 最小缩小到0.5倍
                }
                updateLightboxTransform();
            }, { passive: false });
        }

        lightboxOverlay.addEventListener('click', (e) => {
            // 点击遮罩空白处（非图片容器本身）时关闭
            if (e.target === lightboxOverlay) {
                closeLightboxFunc();
            }
        });
        closeLightbox.addEventListener('click', closeLightboxFunc);

        init();
    </script>
</body>
